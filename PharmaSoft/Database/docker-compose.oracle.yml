services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: pharmasoft-oracle
    environment:
      ORACLE_PASSWORD: "${ORACLE_PASSWORD}"          # mật khẩu SYS/SYSTEM, đặt trong file .env
      APP_USER: pharmasoft                            # tự tạo user trong FREEPDB1
      APP_USER_PASSWORD: "${APP_USER_PASSWORD}"       # mật khẩu user pharmasoft, đặt trong file .env
    ports:
      - "1521:1521"
    volumes:
      - pharmasoft_oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  pharmasoft_oracle_data:
